<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Atendimentos - Canal I</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="../static/logo-comlurb.png" type="image/png">
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-slate-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold tracking-tight">Arquivo Histórico</h1>
                <span class="text-xs bg-slate-600 px-2 py-1 rounded text-slate-300">Acesso: {{ usuario }}</span>
            </div>
            <a href="/admin" class="text-sm bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded transition border border-slate-500">Voltar ao Painel Vivo</a>
            <a href="/logout" class="text-sm bg-red-700 hover:bg-red-600 px-4 py-2 rounded transition border border-red-500">Sair</a>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        
        <div class="bg-white p-6 rounded-xl shadow-sm mb-6 flex flex-wrap gap-4 items-end border border-gray-200">
            <div class="flex flex-col gap-1">
                <label class="text-xs font-bold text-gray-500 uppercase">De:</label>
                <input type="date" id="data-de" class="border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-xs font-bold text-gray-500 uppercase">Até:</label>
                <input type="date" id="data-ate" class="border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="flex-1 flex flex-col gap-1">
                <label class="text-xs font-bold text-gray-500 uppercase">Busca por Nome, Tel ou Matrícula:</label>
                <input type="text" id="busca-texto" placeholder="Ex: 21999..." class="border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full">
            </div>
            <button onclick="buscarHistorico()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2 rounded-lg font-bold shadow-md transition transform active:scale-95">
                Pesquisar
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-200 text-gray-600 text-sm">
                    <tr>
                        <th class="p-4 font-semibold">Início</th>
                        <th class="p-4 font-semibold">Usuário</th>
                        <th class="p-4 font-semibold">Telefone</th>
                        <th class="p-4 font-semibold">Atendente</th>
                        <th class="p-4 font-semibold">Status</th>
                        <th class="p-4 font-semibold text-center">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo" class="text-sm divide-y divide-gray-100 text-gray-700">
                    <tr>
                        <td colspan="6" class="p-10 text-center text-gray-400 italic">Preencha as datas e clique em Pesquisar para carregar os dados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modal-conversa" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-2xl h-[80vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                <div>
                    <h3 id="modal-titulo" class="font-bold text-gray-800">Visualizar Conversa</h3>
                    <p id="modal-subtitulo" class="text-xs text-gray-500"></p>
                </div>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            <div id="modal-chat-box" class="flex-1 overflow-y-auto p-6 bg-[#efeae2] space-y-3" style="background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: rgba(255,255,255,0.7);">
                </div>
            <div class="p-4 bg-gray-50 border-t text-right text-xs text-gray-400">
                Visualização de Auditoria - Somente Leitura
            </div>
        </div>
    </div>

    <script>
        // Define as datas padrão (Início do mês até hoje)
        const hoje = new Date().toISOString().split('T')[0];
        const primeiroDia = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('data-de').value = primeiroDia;
        document.getElementById('data-ate').value = hoje;

        async function buscarHistorico() {
            const de = document.getElementById('data-de').value;
            const ate = document.getElementById('data-ate').value;
            const busca = document.getElementById('busca-texto').value;
            const corpo = document.getElementById('tabela-corpo');

            corpo.innerHTML = '<tr><td colspan="6" class="p-10 text-center text-blue-500 font-bold">Buscando dados no arquivo...</td></tr>';

            try {
                const url = `/admin/api/historico?de=${de}&ate=${ate}&busca=${encodeURIComponent(busca)}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.historico.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="6" class="p-10 text-center text-gray-400">Nenhum registro encontrado para este período.</td></tr>';
                    return;
                }

                corpo.innerHTML = '';
                data.historico.forEach(at => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-blue-50 transition border-l-4 border-transparent hover:border-blue-400';
                    tr.innerHTML = `
                        <td class="p-4">${at.data_inicio}</td>
                        <td class="p-4 font-bold">${at.nome || 'Não identificado'}</td>
                        <td class="p-4 text-xs font-mono">${at.telefone}</td>
                        <td class="p-4">
                            ${(at.atendente_nome && at.atendente_nome !== 'None') 
                                ? `<span class="font-semibold text-blue-700">${at.atendente_nome}</span>` 
                                : '<span class="text-gray-400 italic text-xs">Só Bot</span>'}
                        </td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${at.status === 'finalizado' ? 'bg-gray-100 text-gray-600' : 'bg-green-100 text-green-700'}">${at.status}</span></td>
                        <td class="p-4 text-center">
                            <button class="btn-ver-conversa text-blue-600 hover:underline font-semibold" data-id="${at.id}" data-nome="${(at.nome || at.telefone || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;')}">
                                Ver Conversa
                            </button>
                        </td>
                    `;
                    corpo.appendChild(tr);
                });

            } catch (err) {
                corpo.innerHTML = '<tr><td colspan="6" class="p-10 text-center text-red-500">Erro ao carregar histórico.</td></tr>';
            }
        }

        async function verConversa(id, nome) {
            const chatBox = document.getElementById('modal-chat-box');
            document.getElementById('modal-titulo').innerText = `Conversa com ${nome}`;
            document.getElementById('modal-subtitulo').innerText = `Protocolo ID #${id}`;
            document.getElementById('modal-conversa').classList.remove('hidden');
            chatBox.innerHTML = '<p class="text-center text-gray-500">Carregando mensagens...</p>';

            try {
                const res = await fetch(`/admin/mensagens/${id}`);
                const data = await res.json();
                chatBox.innerHTML = '';

                data.mensagens.forEach(m => {
                    const wrapper = document.createElement('div');
                    wrapper.className = "flex w-full mb-1";
                    const balao = document.createElement('div');

                    if (m.tipo_evento === 'msg_usuario' || m.tipo_evento === 'resumo_handoff') {
                        balao.className = "p-3 rounded-lg max-w-[85%] bg-white shadow-sm text-gray-800 rounded-tl-none border border-gray-100 text-sm";
                        balao.innerHTML = `<span class="text-[10px] text-blue-500 font-bold block mb-1 uppercase">Cliente</span>${m.valor.replace(/\n/g, '<br>')}`;
                        wrapper.appendChild(balao);
                    } else {
                        balao.className = "p-3 rounded-lg max-w-[85%] bg-[#dcf8c6] shadow-sm text-gray-800 rounded-tr-none text-sm";
                        balao.innerHTML = `<span class="text-[10px] text-green-600 font-bold block mb-1 uppercase">Equipe</span>${m.valor.replace(/\n/g, '<br>')}`;
                        wrapper.classList.add("justify-end");
                        wrapper.appendChild(balao);
                    }
                    chatBox.appendChild(wrapper);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML = '<p class="text-center text-red-500">Erro ao carregar mensagens.</p>';
            }
        }

        function fecharModal() {
            document.getElementById('modal-conversa').classList.add('hidden');
        }

        // Captura clique nos botões "Ver Conversa" de forma segura
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('btn-ver-conversa')) {
                const id = e.target.dataset.id;
                const nome = e.target.dataset.nome;
                verConversa(id, nome);
            }
        });
    </script>
</body>
</html>
