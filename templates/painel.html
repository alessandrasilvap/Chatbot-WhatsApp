<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Atendimento - Canal I</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="../static/logo-comlurb.png" type="image/png">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <div class="w-1/3 bg-white border-r flex flex-col shadow-lg z-10">
            
            <div class="p-4 bg-gray-50 border-b flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="font-bold text-gray-700 text-lg">Fila de Espera</h2>
                        <span class="text-xs text-gray-500">Logado como: <strong>{{ usuario }}</strong></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full animate-pulse">Online</span>
                        <a href="/logout" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded transition font-semibold border border-red-200">Sair</a>
                    </div>
                </div>
                
                <div class="flex gap-2">
                    <div class="bg-yellow-50 text-yellow-800 text-xs px-2 py-2 rounded-lg font-semibold border border-yellow-200 flex-1 flex justify-between items-center shadow-sm">
                        <span>Aguardando:</span>
                        <span id="contador-aguardando" class="font-bold text-base bg-yellow-200 px-2 rounded">0</span>
                    </div>
                    <div class="bg-blue-50 text-blue-800 text-xs px-2 py-2 rounded-lg font-semibold border border-blue-200 flex-1 flex justify-between items-center shadow-sm">
                        <span>Atendimento:</span>
                        <span id="contador-atendimento" class="font-bold text-base bg-blue-200 px-2 rounded">0</span>
                    </div>
                </div>

                <div class="flex gap-2 mt-1">
                    <input type="text" id="filtro-texto" onkeyup="renderizarFila()" placeholder="Buscar nome ou telefone..." class="flex-1 border border-gray-300 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-green-500">
                    <select id="filtro-status" onchange="renderizarFila()" class="border border-gray-300 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-green-500 bg-white">
                        <option value="todos">Todos os Status</option>
                        <option value="aguardando">Aguardando</option>
                        <option value="em_atendimento_humano">Em Atendimento</option>
                    </select>
                </div>
            </div>

            <div id="lista-atendimentos" class="flex-1 overflow-y-auto p-2"></div>
        </div>

        <div class="flex-1 flex flex-col relative bg-[#efeae2]">
            <div class="p-4 bg-white border-b shadow-sm flex justify-between items-center" id="chat-header">
            
                <span class="font-bold text-gray-700">Selecione um atendimento ao lado</span>
                <button id="btn-encerrar" onclick="encerrarAtendimento()" class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded shadow transition text-sm font-semibold">
                    Encerrar Atendimento
                </button>
            </div>

            <div class="flex-1 p-6 overflow-y-auto flex flex-col gap-2" id="chat-box" style="background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; background-blend-mode: overlay; background-color: rgba(255,255,255,0.6);">
                <div class="text-center text-gray-500 mt-10 bg-white/80 p-2 rounded w-max mx-auto text-sm shadow-sm">
                    Nenhuma conversa selecionada.
                </div>
            </div>

            <div id="input-area" class="p-4 bg-gray-100 border-t gap-2 hidden flex">
                <button onclick="abrirScripts()"
                    class="bg-white border border-gray-300 hover:bg-gray-100 px-4 rounded-lg shadow-sm text-sm">
                    📄 Scripts
                </button>
            
                <input id="msg-input"
                    class="flex-1 border rounded-lg p-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-green-400"
                    placeholder="Digite uma mensagem..." />
            
                <button onclick="enviarMensagem()" id="btn-enviar"
                    class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg shadow font-semibold transition">
                    Enviar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL SCRIPTS -->
    <div id="modal-scripts" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
        <div class="bg-white w-[400px] max-h-[500px] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="font-bold text-gray-700 text-lg">📄 Scripts Rápidos</h2>
    
                <button onclick="fecharScripts()" class="text-gray-500 hover:text-red-500 text-xl">✕</button>
            </div>
    
            <div id="lista-scripts" class="p-3 flex flex-col gap-2 overflow-y-auto"></div>
        </div>
    </div>
    
    <script>
        let atendimentoSelecionado = null;
        let telefoneSelecionado = null; 
        const atendenteNome = "{{ usuario }}";
        let loopMensagens = null;
        let dadosFilaGlobais = [];

        async function atualizarFila() {
            try {
                const res = await fetch('/admin/fila');
                const data = await res.json();
                
                document.getElementById('contador-aguardando').innerText = data.qtd_aguardando || 0;
                document.getElementById('contador-atendimento').innerText = data.qtd_em_atendimento || 0;

                dadosFilaGlobais = data.fila; // Guarda a fila do servidor
                renderizarFila(); // Chama a função que desenha a tela com os filtros
            } catch (error) {
                console.error("Erro ao buscar a fila:", error);
            }
        }

        function renderizarFila() {
            const textoFiltro = document.getElementById('filtro-texto').value.toLowerCase();
            const statusFiltro = document.getElementById('filtro-status').value;
            const lista = document.getElementById('lista-atendimentos');
            lista.innerHTML = '';
        
            // 1. ORDENAÇÃO: Mais antigos aguardando ficam no topo
            dadosFilaGlobais.sort((a, b) => {
                // Define a prioridade visual (Aguardando > Em Atendimento > Encerrado)
                const peso = { 'aguardando': 1, 'em_atendimento_humano': 2, 'encerrado': 3, 'finalizado': 3 };
                const pesoA = peso[a.status] || 4;
                const pesoB = peso[b.status] || 4;
        
                // Se os status forem diferentes, ordena pela prioridade acima
                if (pesoA !== pesoB) return pesoA - pesoB;
        
                // Se tiverem o mesmo status (ex: dois 'aguardando'), ordena pela data (mais antigo primeiro)
                const dataA = new Date(a.data_inicio.replace(" ", "T"));
                const dataB = new Date(b.data_inicio.replace(" ", "T"));
                return dataA - dataB;
            });
        
            // 2. DESENHA A LISTA
            dadosFilaGlobais.forEach(at => {
                // Filtro de Status
                if (statusFiltro !== 'todos' && at.status !== statusFiltro) return;
                
                // Filtro de Texto
                const busca = `${at.nome || ''} ${at.telefone || ''} ${at.matricula || ''}`.toLowerCase();
                if (textoFiltro && !busca.includes(textoFiltro)) return;
        
                // Cálculo do tempo de espera
                const agora = new Date();
                const inicio = new Date(at.data_inicio.replace(" ", "T"));
                const diffMinutos = Math.floor((agora - inicio) / 60000);
        
                // Variáveis visuais
                let estiloTempo = "text-gray-500";
                let avisoTempo = "";
                let badge = "";
        
                // Regras Específicas por Status
                if (at.status === 'aguardando') {
                    badge = `<span class="bg-yellow-100 text-yellow-800 text-[10px] px-2 py-0.5 rounded-full font-semibold">Aguardando</span>`;
                    if (diffMinutos >= 15) {
                        estiloTempo = "text-red-600 font-bold animate-pulse";
                        avisoTempo = `🚨 Aguardando há ${diffMinutos} min`;
                    } else if (diffMinutos >= 5) {
                        estiloTempo = "text-orange-500 font-semibold";
                        avisoTempo = `⚠️ Aguardando há ${diffMinutos} min`;
                    } else {
                        avisoTempo = `Aguardando há ${diffMinutos} min`;
                    }
                } else if (at.status === 'em_atendimento_humano') {
                    badge = `<span class="bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded-full font-semibold">Em Atendimento</span>`;
                    avisoTempo = "Em atendimento";
                } else if (at.status === 'encerrado' || at.status === 'finalizado') {
                    badge = `<span class="bg-gray-200 text-gray-600 text-[10px] px-2 py-0.5 rounded-full font-semibold">Encerrado</span>`;
                    avisoTempo = "Atendimento finalizado";
                }
        
                // Montagem do HTML da linha (com layout alinhado)
                const div = document.createElement('div');
                div.className = `p-4 mb-2 hover:bg-blue-50 cursor-pointer rounded-lg border border-transparent hover:border-blue-200 transition bg-white shadow-sm flex flex-col gap-1 ${atendimentoSelecionado === at.id ? 'border-blue-500 bg-blue-50' : ''}`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-start w-full">
                        <div class="flex-1">
                            <div class="font-bold text-gray-800 truncate" style="max-width: 150px;">${at.nome || at.telefone}</div>
                            <div class="text-[10px] text-gray-500">Matrícula: ${at.matricula || '---'}</div>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            ${badge}
                        </div>
                    </div>
                    <div class="text-[11px] mt-2 pt-2 border-t border-gray-100 ${estiloTempo}">
                        ${avisoTempo}
                    </div>
                `;
        
                div.onclick = () => selecionarAtendimento(at.id, at.telefone, at.nome, at.status); 
                lista.appendChild(div);
            });
        }

        async function carregarMensagens(id) {
            if (id !== atendimentoSelecionado) return;
            try {
                const res = await fetch(`/admin/mensagens/${id}`);
                const data = await res.json();
                
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = `<div class="text-center text-gray-500 text-xs mb-4 w-full bg-white/80 p-1 rounded-full w-max mx-auto shadow-sm">Histórico do Atendimento #${id}</div>`;
                
                data.mensagens.forEach(m => {
                    const wrapper = document.createElement('div');
                    wrapper.className = "flex w-full mb-1";
                    const balao = document.createElement('div');

                    if (m.tipo_evento === 'msg_usuario' || m.tipo_evento === 'resumo_handoff') {
                        balao.className = "p-3 rounded-lg max-w-[75%] bg-white shadow-sm text-gray-800 rounded-tl-none border border-gray-100";
                        balao.innerHTML = `<span class="text-xs text-blue-500 font-bold block mb-1">Cliente</span>${m.valor.replace(/\n/g, '<br>')}`;
                        wrapper.appendChild(balao);
                    } else if (m.tipo_evento === 'msg_atendente') {
                        let textoLimpo = m.valor.split(':').slice(1).join(':').trim() || m.valor;
                        balao.className = "p-3 rounded-lg max-w-[75%] bg-[#dcf8c6] shadow-sm text-gray-800 rounded-tr-none";
                        balao.innerHTML = `<span class="text-xs text-green-600 font-bold block mb-1">Você</span>${textoLimpo.replace(/\n/g, '<br>')}`;
                        wrapper.classList.add("justify-end");
                        wrapper.appendChild(balao);
                    }
                    chatBox.appendChild(wrapper);
                });
                
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                console.error("Erro ao carregar mensagens:", error);
            }
        }

        async function selecionarAtendimento(id, telefone, nome, status) {
            atendimentoSelecionado = id;
            telefoneSelecionado = telefone; 
            
            const isEncerrado = (status === "encerrado" || status === "finalizado");

            document.getElementById('chat-header').querySelector('span').innerHTML = `Atendendo: <strong>${nome || telefone}</strong> ${isEncerrado ? "<span class='text-red-500 font-bold ml-2 text-sm'>(Somente Leitura)</span>" : ""}`;
            document.getElementById('chat-box').innerHTML = "<div class='text-center mt-10 text-gray-500'>Carregando histórico...</div>";
            
            if (isEncerrado) {
                document.getElementById('input-area').classList.add('hidden');
                document.getElementById('btn-encerrar').classList.add('hidden');
            } else {
                document.getElementById('input-area').classList.remove('hidden');
                document.getElementById('btn-encerrar').classList.remove('hidden');
                
                await fetch('/admin/assumir', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ atendimento_id: id, atendente_nome: atendenteNome })
                });
            }
            
            atualizarFila();
            carregarMensagens(id);

            if(loopMensagens) clearInterval(loopMensagens);
            
            if (!isEncerrado) {
                loopMensagens = setInterval(() => carregarMensagens(id), 3000);
            }
        }

        async function enviarMensagem() {
            const input = document.getElementById('msg-input');
            const btn = document.querySelector('btn-enviar'); 
          
            if (!input.value || !atendimentoSelecionado) return;
      
            const textoEnviado = input.value;
          
            input.disabled = true; // Trava o campo de texto
            btn.disabled = true;   // Trava o botão
            const textoOriginalBtn = btn.innerText;
            btn.innerText = "Enviando..."; // Muda o texto do botão
            btn.style.opacity = "0.5";
      
            try {
                const response = await fetch('/admin/mensagem', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        atendimento_id: atendimentoSelecionado,
                        telefone: telefoneSelecionado, 
                        texto: textoEnviado
                    })
                });
        
                if (response.ok) {
                    input.value = ''; // Limpa o campo se deu certo
                    carregarMensagens(atendimentoSelecionado); // Atualiza o chat
                } else {
                    alert("Erro ao enviar. Tente novamente.");
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
            } finally {
                input.disabled = false;
                btn.disabled = false;
                btn.innerText = textoOriginalBtn;
                btn.style.opacity = "1";
                input.focus(); // Coloca o cursor de volta no campo
            }
        }

        async function encerrarAtendimento() {
            if (!atendimentoSelecionado) return;

            const confirmacao = confirm("Tem certeza que deseja ENCERRAR este atendimento?");
            if (!confirmacao) return;

            await fetch('/admin/encerrar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ atendimento_id: atendimentoSelecionado })
            });
            
            if(loopMensagens) clearInterval(loopMensagens); 
            
            document.getElementById('input-area').classList.add('hidden');
            document.getElementById('btn-encerrar').classList.add('hidden');
            
            document.getElementById('chat-header').querySelector('span').innerHTML += " <span class='text-red-500 font-bold ml-2 text-sm'>(Encerrado)</span>";
            
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += "<div class='text-center mt-4 text-white bg-red-400 p-2 rounded-lg w-max mx-auto shadow-sm font-bold text-sm'>Atendimento Encerrado</div>";
            chatBox.scrollTop = chatBox.scrollHeight;
            
            atualizarFila();
        }

        document.getElementById("msg-input")?.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                enviarMensagem();
            }
        });

        const socket = io();

        socket.on('connect', () => {
            console.log('✅ WebSocket conectado');
            atualizarFila(); // Carrega a fila na primeira conexão
        });
        
        socket.on('fila_atualizada', () => {
            console.log('🔔 Fila atualizada pelo servidor');
            atualizarFila(); // Só roda quando o servidor avisar
        });
        
        socket.on('disconnect', () => {
            console.log('⚠️ WebSocket desconectado, tentando reconectar...');
            // O Socket.IO já tenta reconectar automaticamente
        });

        const scriptsRapidos = [
            {
                titulo: "Saudação",
                texto: "Olá! Como posso ajudar você hoje?"
            },
            {
                titulo: "Aguarde",
                texto: "Só um momento enquanto verifico seu agendamento."
            },
            {
                titulo: "Mídia não identificada",
                texto: "Nosso chatbot e painel não visualizam documentos, áudios, figurinhas ou emojis. Por favor, apenas digite"
            },
            {
                titulo: "Encerramento",
                texto: "Atendimento encerrado. Tenha um ótimo dia!"
            }
        ];

        function abrirScripts() {
            const modal = document.getElementById('modal-scripts');
            const lista = document.getElementById('lista-scripts');

            lista.innerHTML = '';

            scriptsRapidos.forEach(script => {

                const div = document.createElement('div');

                div.className = "border border-gray-200 rounded-xl p-3 hover:bg-gray-50 cursor-pointer transition";

                div.innerHTML = `
                    <div class="font-bold text-sm text-gray-700 mb-1">
                        ${script.titulo}
                    </div>

                    <div class="text-xs text-gray-500">
                        ${script.texto}
                    </div>
                `;

                div.onclick = () => usarScript(script.texto);

                lista.appendChild(div);
            });

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function fecharScripts() {
            const modal = document.getElementById('modal-scripts');
        
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function usarScript(texto) {
            document.getElementById('msg-input').value = texto;
        
            fecharScripts();
        
            document.getElementById('msg-input').focus();
        }
    </script>
</body>
</html>
