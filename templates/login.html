<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Painel de Atendimento</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen bg-[#efeae2]">
  <!--http://localhost:5000/login-->
  <div class="bg-white p-8 rounded-xl shadow-lg w-96 border border-gray-200">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Acesso Restrito</h2>
        <p class="text-sm text-gray-500 mt-1">Insira suas credenciais para continuar</p>
    </div>
    
    {% if erro %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4 text-sm text-center font-semibold">
        {{ erro }}
    </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Usuário</label>
        <input type="text" name="usuario" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50" required placeholder="Ex: admin">
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
        <input type="password" name="senha" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50" required placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 mt-2">
        Entrar no Painel
      </button>
    </form>
  </div>

</body>
</html>
