<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Painel de Atendimento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="../static/logo-comlurb.png" type="image/png">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen bg-[#efeae2]">
  <div class="bg-white p-8 rounded-xl shadow-lg w-96 border border-gray-200">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Acesso Restrito</h2>
        <p class="text-sm text-gray-500 mt-1">Insira suas credenciais para continuar</p>
    </div>
    
    {% if erro %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4 text-sm text-center font-semibold">
        {{ erro }}
    </div>
    {% endif %}

    <form action="/login" method="POST" autocomplete="off" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Usuário</label>
        <input id="usuario" type="text" name="usuario" minlength="4" maxlength="128" autocomplete="off" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50" required placeholder="Ex: admin">
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
        <input id="senha" type="password" name="senha" minlength="3" maxlength="128" autocomplete="off" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50" required placeholder="••••••••">
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Selecionar painel</label>
        <select name="painel" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50 text-gray-700">
          <option value="" disabled selected>Escolha o painel...</option>
          <option value="chat">📞 Chatbot / Atendimento humano</option>
          <option value="disparo">📢 Disparo de mensagens</option>
          <option value="sistema">🩺 Status do Sistema</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 mt-2">
        Entrar no Painel
      </button>
    </form>
  </div>
</body>
</html>
